[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Stary adres Netlify przekierowuje na domenę główną
[[redirects]]
  from = "https://nafubrief.netlify.app/*"
  to = "https://nafu-design.com/:splat"
  status = 301
  force = true

# SPA: wszystkie ścieżki (panel, linki klientów) obsługuje React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex, nofollow"
